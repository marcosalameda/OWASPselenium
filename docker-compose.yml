services:
  zap:
    image: zaproxy/zap-stable
    container_name: zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
    ports:
      - "8080:8080"
    networks:
      - zap-net

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    container_name: selenium
    working_dir: /tests
    volumes:
      - /home/marcos.alameda@quidgest.pt/OWASPselenium/GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
    depends_on:
      - zap
    environment:
      - ZAP_PROXY=http://zap:8080
    networks:
      - zap-net
    command: >
      bash -c "
        dotnet restore SeleniumWebTest.csproj &&
        dotnet test SeleniumWebTest.csproj --filter LoginTest
      "

networks:
  zap-net:
    driver: bridge
