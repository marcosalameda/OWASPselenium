services:
  zap:
    image: zaproxy/zap-stable
    user: root
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      - SE_NODE_CHROME_ARGS=--ignore-certificate-errors --ignore-ssl-errors=yes --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
      - ZAP_PROXY=http://zap:8080
      - selenium_baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium_explicitwait=60000
    command:
      - bash
      - -c
      - |
          echo "=== 0. REPARANDO DEPENDENCIAS Y LIMPIANDO CACHÉ ==="
          # El --force soluciona el error NETSDK1064 de la ejecución anterior
          dotnet restore --force
          dotnet clean
          rm -rf bin/ obj/

          echo "=== 1. CONFIGURANDO ZAP (LIMPIEZA DE BAD_ACTION) ==="
          # Esperamos a que ZAP esté listo
          until curl -sf http://zap:8080/JSON/core/view/version/ >/dev/null; do sleep 2; done
          # COMANDO CORREGIDO: 'setOptionMaxResponseSize' en lugar de 'setOptionMaximumResponseSize'
          curl -sf "http://zap:8080/JSON/core/action/setOptionMaxResponseSize/?size=104857600" || true
          
          curl -sf "http://zap:8080/JSON/context/action/newContext/?contextName=mi-app" || true
          curl -sf "http://zap:8080/JSON/context/action/includeInContext/?contextName=mi-app&regex=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue.*" || true

          echo "=== 2. DESPERTANDO LA WEB (WARM UP) ==="
          which curl || (apt-get update && apt-get install -y curl)
          curl -skL https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/ > /dev/null || echo "⚠️ Web fría, continuando..."

          echo "=== 3. COMPILANDO Y TESTEANDO ==="
          # Recompilamos de cero para asegurar que la línea 29 no existe
          dotnet build --no-restore
          # Usamos --no-build para garantizar que ejecutamos el binario limpio
          dotnet test --no-build --nologo --logger:"console;verbosity=normal" || true

          echo "=== 4. GENERANDO REPORTE DE SEGURIDAD ==="
          curl -sf "http://zap:8080/JSON/reports/action/generate/?title=OWASP+ZAP+Report&template=traditional-html&reportFileName=zap-report&reportDir=/zap/wrk" || true
          echo "✅ Pipeline finalizado."

networks:
  zap-net:
    driver: bridge
