services:
  zap:
    image: zaproxy/zap-stable
    user: root
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      - SE_NODE_CHROME_ARGS=--ignore-certificate-errors --ignore-ssl-errors=yes --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
      - ZAP_PROXY=http://zap:8080
      - selenium_baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium_explicitwait=60000
    command:
      - bash
      - -c
      - |
          echo "=== 1. FORZAR RESTORE Y LIMPIEZA TOTAL ==="
          # El --force arregla el error NETSDK1064 que vimos en el log
          dotnet restore --force
          dotnet clean
          rm -rf bin/ obj/

          echo "=== 2. CONFIGURAR ZAP (MÁXIMO RENDIMIENTO) ==="
          until curl -sf http://zap:8080/JSON/core/view/version/ >/dev/null; do sleep 2; done
          # Subimos el límite de respuesta a 100MB para que Google no bloquee a ZAP
          curl -sf "http://zap:8080/JSON/core/action/setOptionMaximumResponseSize/?size=104857600"

          echo "=== 3. WARM UP (DESPERTAR WEB) ==="
          curl -skL https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/ > /dev/null || echo "Web fría"

          echo "=== 4. RECOMPILAR Y TESTEAR ==="
          dotnet build --no-restore
          # Usamos --no-build para asegurar que usamos lo que acabamos de compilar limpiamente
          dotnet test --no-build --nologo --logger:"console;verbosity=normal" || true

          echo "=== 5. REPORTE ==="
          curl -sf "http://zap:8080/JSON/reports/action/generate/?title=OWASP+ZAP+Report&template=traditional-html&reportFileName=zap-report&reportDir=/zap/wrk"
