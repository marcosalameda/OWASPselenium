services:
  zap:
    image: zaproxy/zap-stable
    user: root                          # ← ZAP corre como root, tiene permisos sobre el volumen
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      SE_NODE_CHROME_ARGS: >
        --ignore-certificate-errors
        --ignore-ssl-errors=yes
        --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      selenium.baseurl: https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      ZAP_PROXY: http://zap:8080
      NO_PROXY: "localhost,127.0.0.1,selenium-hub,nuget.org,api.nuget.org"
      no_proxy: "localhost,127.0.0.1,selenium-hub,nuget.org,api.nuget.org"
    command:
      - bash
      - -c
      - |
          set -e
          echo "Waiting for ZAP..."
          until curl -sf http://zap:8080/JSON/core/view/version/ >/dev/null; do sleep 2; done
          echo "ZAP ready"
          echo "Waiting for Selenium Grid..."
          until curl -sf http://selenium-hub:4444/status >/dev/null; do sleep 2; done
          echo "Selenium Grid ready"
          echo "Configuring ZAP context..."
          curl -sf "http://zap:8080/JSON/context/action/newContext/?contextName=mi-app" > /dev/null
          curl -sf "http://zap:8080/JSON/context/action/includeInContext/?contextName=mi-app&regex=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue.*" > /dev/null
          echo "ZAP context configured"
          echo "Running Selenium test (LoginTest)..."
          dotnet restore SeleniumWebTest.csproj
          dotnet test SeleniumWebTest.csproj --filter "LoginTest" || true
          echo "Generating OWASP ZAP HTML report..."
          curl -sf "http://zap:8080/JSON/reports/action/generate/" \
            --get \
            --data-urlencode "title=OWASP ZAP Report" \
            --data-urlencode "template=traditional-html" \
            --data-urlencode "contexts=mi-app" \
            --data-urlencode "reportFileName=zap-report" \
            --data-urlencode "reportDir=/zap/wrk" \
            > /dev/null
          echo "ZAP report generated"

networks:
  zap-net:
    driver: bridge
