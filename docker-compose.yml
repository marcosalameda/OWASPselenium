version: "3.9"

services:

  zap:
    image: zaproxy/zap-stable
    container_name: zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/reports
    networks:
      - zap-net

  selenium-hub:
    image: selenium/standalone-chrome:latest
    container_name: selenium-hub
    shm_size: 2gb
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    container_name: selenium-tests
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
    depends_on:
      selenium-hub:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      - ZAP_PROXY=http://zap:8080
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
    networks:
      - zap-net
    command: >
      bash -c "
        echo '▶️ Running Selenium tests' &&
        dotnet restore SeleniumWebTest.csproj &&
        dotnet test SeleniumWebTest.csproj --filter LoginTest || true &&
        echo '🛡 Generating ZAP HTML report' &&
        curl 'http://zap:8080/JSON/core/action/generateReport/' \
          --data 'title=ZAP Security Report' \
          --data 'template=traditional-html' \
          --data 'reportFileName=zap-report.html' \
          --data 'reportDir=/zap/reports'
      "

networks:
  zap-net:
    driver: bridge
