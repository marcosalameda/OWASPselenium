services:
  zap:
    image: zaproxy/zap-stable
    user: root
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      - SE_NODE_CHROME_ARGS=--ignore-certificate-errors --ignore-ssl-errors=yes --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
      - ZAP_PROXY=http://zap:8080
      - selenium.baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium_baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium.explicitwait=30000
      - selenium_explicitwait=30000
      - selenium.implicitwait=10000
      - selenium_implicitwait=10000
      - NO_PROXY=localhost,127.0.0.1,selenium-hub,nuget.org,api.nuget.org
      - no_proxy=localhost,127.0.0.1,selenium-hub,nuget.org,api.nuget.org
    command:
      - bash
      - -c
      - |
          echo "Despertando la web..."
          curl -sL https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/ > /dev/null

          echo "Ejecutando tests..."
          dotnet test --nologo --logger:"console;verbosity=normal"
      
          set -e
          echo "=== DIAGNÓSTICO DE VARIABLES ==="
          echo "ZAP_PROXY = $$ZAP_PROXY"
          echo "SELENIUM_REMOTE_URL = $$SELENIUM_REMOTE_URL"
          echo "================================"

          echo "Waiting for services..."
          until curl -sf http://zap:8080/JSON/core/view/version/ >/dev/null; do sleep 2; done
          until curl -sf http://selenium-hub:4444/status >/dev/null; do sleep 2; done
          echo "Services ready"

          echo "Configuring ZAP context & exclusions..."
          curl -sf "http://zap:8080/JSON/context/action/newContext/?contextName=mi-app" > /dev/null
          curl -sf "http://zap:8080/JSON/context/action/includeInContext/?contextName=mi-app&regex=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue.*" > /dev/null
          
          for regex in ".*google.*" ".*gstatic.*" ".*googleapis.*" ".*digicert.*" ".*mozilla.*"; do
            curl -sf "http://zap:8080/JSON/core/action/excludeFromProxy/?regex=$$regex" > /dev/null
            echo "Excluded: $$regex"
          done

          echo "Running ALL Selenium tests..."
          dotnet restore SeleniumWebTest.csproj
          dotnet test SeleniumWebTest.csproj --logger:"console;verbosity=normal" || true

          echo "Generating OWASP ZAP HTML report..."
          curl -sf "http://zap:8080/JSON/reports/action/generate/" \
            --get \
            --data-urlencode "title=OWASP ZAP Report" \
            --data-urlencode "template=traditional-html" \
            --data-urlencode "contexts=mi-app" \
            --data-urlencode "reportFileName=zap-report" \
            --data-urlencode "reportDir=/zap/wrk" \
            > /dev/null
          echo "ZAP report generated"

networks:
  zap-net:
    driver: bridge
