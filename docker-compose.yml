version: "3.9"
services:
  zap:
    image: zaproxy/zap-stable
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/reports
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      SE_NODE_CHROME_ARGS: >
        --ignore-certificate-errors
        --ignore-ssl-errors=yes
        --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      selenium.baseurl: https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      ZAP_PROXY: http://zap:8080
      # ❌ ELIMINADAS: http_proxy, https_proxy, HTTP_PROXY, HTTPS_PROXY
      # Estas variables mandaban TODO el tráfico del contenedor por ZAP,
      #
