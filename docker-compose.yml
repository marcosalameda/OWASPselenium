services:
  zap:
    image: zaproxy/zap-stable
    user: root
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      - SE_NODE_CHROME_ARGS=--ignore-certificate-errors --ignore-ssl-errors=yes --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
      - ZAP_PROXY=http://zap:8080
      - selenium.baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium_baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium.explicitwait=60000
      - selenium_explicitwait=60000
      - NO_PROXY=localhost,127.0.0.1,selenium-hub,nuget.org,api.nuget.org
    command:
      - bash
      - -c
      - |
          echo "=== 0. REPARANDO Y LIMPIANDO CACHÉ ==="
          # Forzamos restore para evitar el error NETSDK1064 de la ejecución #54
          dotnet restore --force
          dotnet clean
          rm -rf bin/ obj/

          echo "=== 1. CONFIGURANDO ZAP (TAMAÑO DE RESPUESTA) ==="
          # Esperamos a ZAP y subimos el límite de respuesta a 50MB para evitar errores con Google
          until curl -sf http://zap:8080/JSON/core/view/version/ >/dev/null; do sleep 2; done
          curl -sf "http://zap:8080/JSON/core/action/setOptionMaximumResponseSize/?size=52428800"
          
          curl -sf "http://zap:8080/JSON/context/action/newContext/?contextName=mi-app" || true
          curl -sf "http://zap:8080/JSON/context/action/includeInContext/?contextName=mi-app&regex=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue.*" || true

          echo "=== 2. WARM UP ==="
          # Instalamos curl si falta y despertamos la web
          which curl || (apt-get update && apt-get install -y curl)
          curl -skL https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/ > /dev/null || echo "Warm up fallido, continuando..."

          echo "=== 3. EJECUTANDO TESTS ==="
          # Compilamos de cero para asegurar que la línea 29 no exista
          dotnet build --no-restore
          dotnet test --no-build --nologo --logger:"console;verbosity=normal" || true

          echo "=== 4. GENERANDO REPORTE FINAL ==="
          curl -sf "http://zap:8080/JSON/reports/action/generate/?title=OWASP+ZAP+Report&template=traditional-html&contexts=mi-app&reportFileName=zap-report&reportDir=/zap/wrk" || true
          echo "✅ Proceso completado."

networks:
  zap-net:
    driver: bridge
