services:
  zap:
    image: zaproxy/zap-stable
    user: root
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      - SE_NODE_CHROME_ARGS=--ignore-certificate-errors --ignore-ssl-errors=yes --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
      - ZAP_PROXY=http://zap:8080
      - selenium.baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium_baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium.explicitwait=30000
      - selenium_explicitwait=30000
      - selenium.implicitwait=10000
      - selenium_implicitwait=10000
      - NO_PROXY=localhost,127.0.0.1,selenium-hub,nuget.org,api.nuget.org
      - no_proxy=localhost,127.0.0.1,selenium-hub,nuget.org,api.nuget.org
    command:
      - bash
      - -c
      - |
          # 1. LIMPIEZA RADICAL DE CACHÉ
          echo "=== 0. LIMPIANDO BINARIOS FANTASMA ==="
          dotnet clean SeleniumWebTest.csproj [cite: 318]
          rm -rf bin/ obj/

          # 2. CALENTAMIENTO DE LA WEB
          echo "=== 1. DESPERTANDO LA WEB (WARM UP) ==="
          [cite_start]curl -skL https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/ > /dev/null || echo "⚠️ Warm up fallido, continuando..." [cite: 313, 314]

          # 3. ESPERA Y CONFIGURACIÓN DE ZAP
          echo "=== 2. CONFIGURANDO ZAP ==="
          [cite_start]until curl -sf http://zap:8080/JSON/core/view/version/ >/dev/null; do sleep 2; done [cite: 312]
          
          curl -sf "http://zap:8080/JSON/context/action/newContext/?contextName=mi-app" > /dev/null
          curl -sf "http://zap:8080/JSON/context/action/includeInContext/?contextName=mi-app&regex=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue.*" > /dev/null
          
          for r in ".*google.*" ".*gstatic.*" ".*googleapis.*" ".*digicert.*" ".*mozilla.*"; do
            curl -sf "http://zap:8080/JSON/core/action/excludeFromProxy/?regex=$$r" > /dev/null
            [cite_start]echo "Excluded: $$r" [cite: 315, 316, 317]
          done

          # 4. RECOMPILACIÓN Y EJECUCIÓN
          echo "=== 3. RECOMPILANDO Y EJECUTANDO TESTS ==="
          [cite_start]dotnet restore SeleniumWebTest.csproj [cite: 319, 321]
          [cite_start]dotnet build SeleniumWebTest.csproj --no-restore [cite: 322]
          # El || true permite que el reporte de ZAP se genere aunque fallen los tests
          [cite_start]dotnet test SeleniumWebTest.csproj --no-build --nologo --logger:\"console;verbosity=normal\" || true [cite: 318, 322, 331]

          # 5. GENERACIÓN DEL REPORTE DE SEGURIDAD
          echo "=== 4. GENERANDO REPORTE OWASP ZAP ==="
          curl -sf "http://zap:8080/JSON/reports/action/generate/?title=OWASP+ZAP+Report&template=traditional-html&contexts=mi-app&reportFileName=zap-report&reportDir=/zap/wrk" > /dev/null
          echo "✅ Proceso completado. Revisa la carpeta zap-reports."

networks:
  zap-net:
    driver: bridge
