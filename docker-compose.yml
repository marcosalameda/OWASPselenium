services:
  zap:
    image: zaproxy/zap-stable
    container_name: zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.* 
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/reports
    networks:
      - zap-net

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    container_name: selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
    depends_on:
      - zap
    environment:
      - ZAP_PROXY=http://zap:8080
    networks:
      - zap-net
    command: >
      bash -c "
        echo '▶️ Running Selenium tests' &&
        dotnet restore SeleniumWebTest.csproj &&
        dotnet test SeleniumWebTest.csproj --filter LoginTest || true &&
        echo '🛡 Generating ZAP HTML report' &&
        curl 'http://zap:8080/JSON/core/action/generateReport/' \
          --data 'title=ZAP Security Report' \
          --data 'template=traditional-html' \
          --data 'reportFileName=zap-report.html' \
          --data 'reportDir=/zap/reports'
      "

networks:
  zap-net:
    driver: bridge
