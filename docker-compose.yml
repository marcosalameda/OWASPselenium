services:
  zap:
    image: zaproxy/zap-stable
    user: root
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - zap-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium-hub:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    networks:
      - zap-net
    environment:
      - SE_NODE_CHROME_ARGS=--ignore-certificate-errors --ignore-ssl-errors=yes --allow-insecure-localhost
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  selenium:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    working_dir: /tests
    volumes:
      - ./GEN_QUIDVUE/HORIZONTAL_VUE/CsUITest:/tests
      - ./zap-reports:/reports
    depends_on:
      zap:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    networks:
      - zap-net
    environment:
      - SELENIUM_REMOTE_URL=http://selenium-hub:4444/wd/hub
      - ZAP_PROXY=http://zap:8080
      - selenium_baseurl=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue/
      - selenium_explicitwait=60000
    command:
      - bash
      - -c
      - |
          echo "=== 0. LIMPIEZA Y REGENERACIÓN DE ACTIVOS ==="
          # Borramos binarios y temporales para eliminar la linea 29 vieja
          dotnet clean
          rm -rf bin/ obj/
          
          # CRUCIAL: Regeneramos el archivo project.assets.json tras borrar obj/
          dotnet restore --force

          echo "=== 1. CONFIGURANDO ZAP ==="
          until curl -sf http://zap:8080/JSON/core/view/version/ >/dev/null; do sleep 2; done
          # Ignoramos el error BAD_ACTION para que no detenga el flujo
          curl -sf "http://zap:8080/JSON/core/action/setOptionMaxResponseSize/?size=104857600" || true
          
          curl -sf "http://zap:8080/JSON/context/action/newContext/?contextName=mi-app" || true
          curl -sf "http://zap:8080/JSON/context/action/includeInContext/?contextName=mi-app&regex=https://jenkinsvm.quidgest.pt/gqt_horizontal_vue.*" || true

          echo "=== 2. COMPILACIÓN Y EJECUCIÓN DE TESTS ==="
          # Ahora el build sí encontrará los archivos regenerados
          dotnet build --no-restore
          # Ejecutamos los tests. He quitado el || true para ver el fallo real si ocurre.
          dotnet test --no-build --nologo --logger:"console;verbosity=normal"

          echo "=== 3. GENERACIÓN DEL INFORME ZAP ==="
          curl -sf "http://zap:8080/JSON/reports/action/generate/?title=OWASP+ZAP+Report&template=traditional-html&reportFileName=zap-report&reportDir=/zap/wrk" || true
          echo "✅ Proceso completado correctamente."

networks:
  zap-net:
    driver: bridge
